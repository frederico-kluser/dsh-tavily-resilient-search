name: Release

# Publica no npm com proveniência OIDC (trusted publishing). Pré-requisito
# único, no console do npm: associar este repositório como trusted publisher de
# `dsh-tavily-resilient-search`. Sem isso, o passo de publish falha alto — de
# propósito (nunca token em secrets). O GitHub Release é criado a partir de um
# gate VERDE e de forma independente do publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: gate completo + publint + attw
        run: |
          pnpm run gate
          pnpm exec publint
          pnpm exec attw --pack . --profile esm-only
      - name: GitHub Release (idempotente, após gate verde)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} já existe — ignorado."
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
          fi
      - name: publish (OIDC provenance, idempotente)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Existência consultada pelo documento DA VERSÃO (menos cacheado que o
          # packument) e com cache-buster: logo após um publish local o packument
          # do CDN pode ainda não refletir a versão, e um "ausente" prematuro
          # cairia num publish sem autenticação.
          version_exists() {
            node -e "fetch('https://registry.npmjs.org/dsh-tavily-resilient-search/${VERSION}?t='+Date.now()).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
          }
          seen=0
          for i in 1 2 3 4 5 6 7 8; do
            if version_exists; then seen=1; break; fi
            sleep 10
          done
          if [ "$seen" = "1" ]; then
            echo "v${VERSION} já publicada no npm — publish ignorado."
          elif pnpm publish --access public --provenance --no-git-checks; then
            echo "v${VERSION} publicada via OIDC."
          elif version_exists; then
            echo "v${VERSION} publicada entretanto por outro caminho — ignorado."
          else
            echo "publish falhou e v${VERSION} não existe no npm." >&2
            exit 1
          fi
